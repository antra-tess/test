<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Instant Deposit Machine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        h1 {
            color: #00d9ff;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .balance-display {
            background: linear-gradient(145deg, #1e2a4a, #0d1a30);
            border: 2px solid #00d9ff;
            border-radius: 20px;
            padding: 2rem 3rem;
            margin-bottom: 3rem;
            box-shadow: 0 0 40px rgba(0, 217, 255, 0.2),
                        inset 0 0 30px rgba(0, 217, 255, 0.05);
        }

        .balance-label {
            color: #00d9ff;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 0.5rem;
        }

        .balance-amount {
            color: #00ff88;
            font-size: 4rem;
            font-weight: bold;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
            font-family: 'Courier New', monospace;
        }

        .deposit-btn {
            position: relative;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            background: linear-gradient(145deg, #00ff88, #00cc6a);
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.4),
                        0 0 60px rgba(0, 255, 136, 0.2),
                        inset 0 -5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .deposit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(0, 255, 136, 0.5),
                        0 0 80px rgba(0, 255, 136, 0.3),
                        inset 0 -5px 20px rgba(0, 0, 0, 0.2);
        }

        .deposit-btn:active {
            transform: scale(0.95);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4),
                        inset 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .deposit-btn .dollar {
            font-size: 4rem;
            color: #0a3d24;
            line-height: 1;
        }

        .deposit-btn .amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: #0a3d24;
        }

        .deposit-btn .label {
            font-size: 0.9rem;
            color: #0a3d24;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.3rem;
        }

        .transaction-history {
            margin-top: 3rem;
            width: 100%;
            max-width: 400px;
        }

        .history-title {
            color: #00d9ff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .transactions {
            max-height: 200px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .transactions::-webkit-scrollbar {
            width: 6px;
        }

        .transactions::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        .transactions::-webkit-scrollbar-thumb {
            background: #00d9ff;
            border-radius: 3px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1rem;
            background: rgba(0, 217, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 0.5rem;
            border-left: 3px solid #00ff88;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .transaction-time {
            color: #666;
            font-size: 0.8rem;
        }

        .transaction-amount {
            color: #00ff88;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* Floating money animation */
        .money-float {
            position: fixed;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 2s ease-out forwards;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-400px) rotate(20deg) scale(1.5);
            }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 999;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(400px) rotate(720deg);
            }
        }

        /* Pulse ring animation */
        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #00ff88;
            animation: pulse 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .disclaimer {
            position: fixed;
            bottom: 20px;
            color: #444;
            font-size: 0.7rem;
            text-align: center;
        }

        /* Sound toggle */
        .sound-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid #00d9ff;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            color: #00d9ff;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .sound-toggle:hover {
            background: rgba(0, 217, 255, 0.2);
        }

        /* Streak counter */
        .streak {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 136, 0, 0.1);
            border: 1px solid #ff8800;
            border-radius: 10px;
            padding: 0.5rem 1rem;
            color: #ff8800;
            font-size: 0.9rem;
        }

        .streak-fire {
            animation: fire 0.5s ease infinite alternate;
        }

        @keyframes fire {
            from { text-shadow: 0 0 10px #ff8800; }
            to { text-shadow: 0 0 20px #ff0000; }
        }
    </style>
</head>
<body>
    <div class="streak">
        🔥 Streak: <span id="streak">0</span>
    </div>

    <button class="sound-toggle" id="soundToggle">🔊 Sound ON</button>

    <div class="container">
        <h1>💰 Instant Deposit Machine</h1>
        <p class="subtitle">Your personal money printer goes brrr...</p>

        <div class="balance-display">
            <div class="balance-label">Current Balance</div>
            <div class="balance-amount" id="balance">$0.00</div>
        </div>

        <button class="deposit-btn" id="depositBtn">
            <span class="dollar">$</span>
            <span class="amount">1,000</span>
            <span class="label">Deposit</span>
        </button>

        <div class="transaction-history">
            <div class="history-title">Recent Transactions</div>
            <div class="transactions" id="transactions"></div>
        </div>
    </div>

    <p class="disclaimer">⚠️ Disclaimer: This is a simulation. No actual money is being deposited. But wouldn't it be nice?</p>

    <script>
        let balance = 0;
        let streak = 0;
        let lastClick = 0;
        let soundEnabled = true;

        // Audio context for sounds
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playDepositSound() {
            if (!soundEnabled) return;

            // Create a nice "cha-ching" sound
            const oscillator1 = audioCtx.createOscillator();
            const oscillator2 = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator1.connect(gainNode);
            oscillator2.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator1.frequency.setValueAtTime(800, audioCtx.currentTime);
            oscillator1.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.1);

            oscillator2.frequency.setValueAtTime(1000, audioCtx.currentTime);
            oscillator2.frequency.setValueAtTime(1600, audioCtx.currentTime + 0.1);

            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialDecayTo = 0.01;
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);

            oscillator1.start(audioCtx.currentTime);
            oscillator2.start(audioCtx.currentTime);
            oscillator1.stop(audioCtx.currentTime + 0.3);
            oscillator2.stop(audioCtx.currentTime + 0.3);
        }

        function formatMoney(amount) {
            return '$' + amount.toLocaleString('en-US', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }

        function createFloatingMoney(x, y) {
            const emojis = ['💵', '💰', '💎', '🤑', '💸'];
            for (let i = 0; i < 5; i++) {
                const money = document.createElement('div');
                money.className = 'money-float';
                money.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                money.style.left = (x + (Math.random() - 0.5) * 100) + 'px';
                money.style.top = y + 'px';
                money.style.animationDelay = (i * 0.1) + 's';
                document.body.appendChild(money);

                setTimeout(() => money.remove(), 2000);
            }
        }

        function createConfetti() {
            const colors = ['#00ff88', '#00d9ff', '#ff8800', '#ff0088', '#8800ff'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * window.innerWidth + 'px';
                confetti.style.top = '-20px';
                confetti.style.width = '10px';
                confetti.style.height = '10px';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animation = `confettiFall ${1 + Math.random()}s ease-out forwards`;
                confetti.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(confetti);

                setTimeout(() => confetti.remove(), 2000);
            }
        }

        function createPulseRing() {
            const btn = document.getElementById('depositBtn');
            const ring = document.createElement('div');
            ring.className = 'pulse-ring';
            btn.appendChild(ring);
            setTimeout(() => ring.remove(), 1000);
        }

        function animateBalance(start, end) {
            const duration = 500;
            const startTime = performance.now();
            const balanceEl = document.getElementById('balance');

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing function
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = start + (end - start) * eased;

                balanceEl.textContent = formatMoney(current);

                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }

            requestAnimationFrame(update);
        }

        function addTransaction() {
            const container = document.getElementById('transactions');
            const transaction = document.createElement('div');
            transaction.className = 'transaction';

            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            transaction.innerHTML = `
                <span class="transaction-time">${timeStr}</span>
                <span class="transaction-amount">+$1,000.00</span>
            `;

            container.insertBefore(transaction, container.firstChild);

            // Keep only last 50 transactions
            while (container.children.length > 50) {
                container.removeChild(container.lastChild);
            }
        }

        function updateStreak() {
            const now = Date.now();
            if (now - lastClick < 2000) {
                streak++;
            } else {
                streak = 1;
            }
            lastClick = now;

            const streakEl = document.getElementById('streak');
            streakEl.textContent = streak;

            if (streak >= 5) {
                streakEl.parentElement.classList.add('streak-fire');
            } else {
                streakEl.parentElement.classList.remove('streak-fire');
            }

            // Bonus confetti for high streaks
            if (streak % 10 === 0) {
                createConfetti();
            }
        }

        function deposit(event) {
            const oldBalance = balance;
            balance += 1000;

            playDepositSound();
            animateBalance(oldBalance, balance);
            createFloatingMoney(event.clientX, event.clientY);
            createPulseRing();
            addTransaction();
            updateStreak();

            // Milestone celebrations
            if (balance === 10000 || balance === 100000 || balance === 1000000) {
                createConfetti();
            }
        }

        // Event listeners
        document.getElementById('depositBtn').addEventListener('click', deposit);

        document.getElementById('soundToggle').addEventListener('click', function() {
            soundEnabled = !soundEnabled;
            this.textContent = soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
        });

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                const btn = document.getElementById('depositBtn');
                const rect = btn.getBoundingClientRect();
                deposit({
                    clientX: rect.left + rect.width / 2,
                    clientY: rect.top + rect.height / 2
                });
            }
        });

        // Initialize audio context on first interaction
        document.addEventListener('click', function initAudio() {
            audioCtx.resume();
            document.removeEventListener('click', initAudio);
        }, { once: true });
    </script>
</body>
</html>
